name: Diagnose Production Routing

on:
  workflow_dispatch:
  push:
    branches: [codex/next-web-preview]
    paths:
      - .github/workflows/diagnose-production-routing.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect routes and local services
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== matching nginx files ==="
          matching_files="$(grep -RslE 'server_name[[:space:]][^;]*zhiyincareer\.com' \
            /www/server/panel/vhost/nginx /www/server/nginx/conf/vhost /etc/nginx/sites-enabled /etc/nginx/conf.d \
            2>/dev/null | grep -Ev '\.bak\.|\.backup|\.old' | sort -u)"
          printf '%s\n' "$matching_files" | while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "--- $file"
              grep -nE 'server_name|location|proxy_pass|root |listen ' "$file" || true
            done

          echo "=== listening node ports ==="
          ss -ltnp 2>/dev/null | grep -E 'node|:3000|:3001|:3100|:3101|:3102|:4000|:4400|:5000|:8080' || true

          echo "=== local endpoint probes ==="
          payload='{"account":"codex-connectivity-check-invalid","password":"invalid-check-only"}'
          for port in 3000 3001 3100 3101 3102 4000 4400 5000 8080; do
            for path in \
              '/api/jobs?page=1&pageSize=1' \
              '/api/users/web-login' \
              '/api/proxy/users/web-login' \
              '/api/v4/users/web-login' \
              '/users/web-login'; do
              : > /tmp/diag-headers
              : > /tmp/diag-body
              case "$path" in
                *web-login)
                  code="$(curl -sS -D /tmp/diag-headers -o /tmp/diag-body -w '%{http_code}' --max-time 4 -H 'Content-Type: application/json' -d "$payload" "http://127.0.0.1:${port}${path}" || true)"
                  ;;
                *)
                  code="$(curl -sS -D /tmp/diag-headers -o /tmp/diag-body -w '%{http_code}' --max-time 4 "http://127.0.0.1:${port}${path}" || true)"
                  ;;
              esac
              content_type="$(awk -F': ' 'tolower($1) == "content-type" { value=$2 } END { gsub(/\r/, "", value); print value }' /tmp/diag-headers)"
              body_prefix="$(head -c 120 /tmp/diag-body | tr '\r\n' '  ' | sed 's/[[:space:]]\+/ /g')"
              echo "port=$port path=$path status=${code:-none} type=${content_type:-none} body=$body_prefix"
            done
          done
          rm -f /tmp/diag-headers /tmp/diag-body
          REMOTE
